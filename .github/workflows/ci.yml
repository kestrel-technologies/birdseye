# Birdseye CI: flake8 + pytest on the pinned runtime (Python 3.8, requirements.txt as deployed).
name: ci
on:
  pull_request: { branches: [develop, uat, main] }
  push: { branches: [develop, uat, main] }
permissions: { contents: read }
jobs:
  test:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with: { python-version: '3.8' }
      - run: pip install -r requirements.txt pytest flake8
      - run: flake8 birdseye tests
      - run: pytest -q
